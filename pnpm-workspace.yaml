  loupe: "^2.3.6"
  nan: "^2.19.0"
  elliptic: ">=6.6.1"
  "@chainsafe/as-sha256": "1.2.4"
  "@chainsafe/blst": "2.2.0"
  "@chainsafe/persistent-merkle-tree": "1.3.0"
  "@chainsafe/pubkey-index-map": "3.0.0"
